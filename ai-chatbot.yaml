enabled: true
ai_enabled: true
ai_disabled_response_text: "AI assistant is currently disabled. Please search our FAQ or contact site support for assistance."
provider: gemini
api_key: YOUR_API_KEY_HERE
model: gemini-2.0-flash
custom_endpoint: ''
api_timeout: 30
max_tokens: 800

faq_enabled: true
enable_multilingual_faq: true
faq_route: /faq
faq_similarity_threshold: 70

contact_route: /contact
enable_hidden_contacts: true
hidden_contact_route: /hidden-contacts

rate_limit_enabled: true
rate_limit_max_requests: 10
rate_limit_window_seconds: 60
strict_site_scope: true

blacklist_filter_enabled: true
blacklist_words: "spam\nscam\nhack\nexploit\nbypass\nadmin_password\nsecret_token\nleak\nporn\ncasino\ngambling\nillegal"
blacklist_response_text: "⚠️ Safety Guardrail: Your message contains prohibited words or topics that violate our safety policy. Please rephrase your question using appropriate language."

export_require_auth: true
export_allowed_users: "admin\nmilkboy"

session_retention_days: 7

logging_enabled: true
log_api_usage: true
cost_input_token_price_per_m: '0.15'
cost_output_token_price_per_m: '0.60'

theme_preset: glass_blue
position: bottom-right
display_mode: all
display_pages: "/\n/contact\n/faq"
welcome_message: 'Hello! How can I help you with this website today?'
custom_error_message: 'An unexpected connection error occurred. Please try again later.'
accent_color: '#3b82f6'

quick_replies_enabled: true
quick_replies:
  - label: '📝 Summarize Page'
    type: action
    action_or_prompt: summarize_page
  - label: '📞 Contact Owner'
    type: action
    action_or_prompt: contact
  - label: '❓ Founding Date'
    type: question
    action_or_prompt: 'When was this company established?'

notification_enabled: true
notification_text: '👋 Hi there! Need help finding anything on our website?'
notification_delay_seconds: 4
