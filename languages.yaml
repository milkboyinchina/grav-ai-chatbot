en:
  PLUGIN_AI_CHATBOT:
    ENABLED: Enabled
    PROVIDER_SETTINGS: AI Provider Settings
    AI_ENABLED: Enable AI API Fallback
    AI_ENABLED_HELP: When disabled, chatbot strictly uses local FAQ page answers and will not make AI API calls.
    AI_DISABLED_RESPONSE_TEXT: AI Disabled Response Message
    AI_DISABLED_RESPONSE_TEXT_HELP: Custom reply message sent to visitor when no local FAQ answer match is found and AI API fallback is disabled.
    PROVIDER: AI Provider Engine
    PROVIDER_HELP: Select your preferred AI provider model (Groq, Google Gemini, OpenRouter, OpenAI, or Custom)
    API_KEY: API Key
    API_KEY_HELP: Enter your provider API Key securely (leave blank for local Ollama / self-hosted models)
    MODEL: Model Identifier
    MODEL_HELP: E.g. gemini-2.0-flash, gemini-2.0-flash-lite, llama-3.3-70b-versatile, gpt-4o-mini
    CUSTOM_ENDPOINT: Custom Base Endpoint URL
    CUSTOM_ENDPOINT_HELP: E.g. https://openrouter.ai/api/v1 (only required for Custom provider)
    CUSTOM_SYSTEM_PROMPT: Custom System Prompt / Instructions
    CUSTOM_SYSTEM_PROMPT_HELP: Custom system instructions for AI model. If left empty, defaults to CoT suppression and character limit rules.
    MAX_RESPONSE_CHARS: Max Response Characters (Soft Limit)
    MAX_RESPONSE_CHARS_HELP: Soft guidance for maximum characters in AI replies (default 1000 characters).
    TEST_CONNECTION: Test AI API Connection
    TEST_CONNECTION_HELP: Test your API key and provider model configuration live before saving settings
    FAQ_SETTINGS: FAQ Pre-Matching Settings
    FAQ_ENABLED: Enable FAQ Pre-Matching
    FAQ_ENABLED_HELP: Answers matching questions from the FAQ page directly without using AI API keys
    ENABLE_MULTILINGUAL_FAQ: Enable Multilingual FAQ Matching
    ENABLE_MULTILINGUAL_FAQ_HELP: Automatically uses visitor language to match localized FAQ pages (e.g. faq.id.md, /id/faq)
    FAQ_ROUTE: FAQ Page Route
    FAQ_ROUTE_HELP: Route to your website FAQ page (e.g. /faq)
    FAQ_SIMILARITY: FAQ Match Sensitivity (%)
    FAQ_SIMILARITY_HELP: Similarity threshold score (50-100%) to match user questions with FAQ items
    CONTACT_SETTINGS: Contact Page Resolution Settings
    CONTACT_ROUTE: Public Contact Page Route
    CONTACT_ROUTE_HELP: Route to public contact page (e.g. /contact)
    ENABLE_HIDDEN_CONTACTS: Enable Hidden Contact Page
    ENABLE_HIDDEN_CONTACTS_HELP: Reads unpublished/hidden contact page for specialized requests (engineers, leads)
    HIDDEN_CONTACT_ROUTE: Hidden Contact Page Route
    HIDDEN_CONTACT_ROUTE_HELP: Route to hidden contact page (e.g. /hidden-contacts)
    SECURITY_SETTINGS: Security & Rate Limiting
    RATE_LIMIT_ENABLED: Enable IP Rate Limiting
    RATE_LIMIT_MAX: Max Requests Per Window
    RATE_LIMIT_WINDOW: Window Duration (Seconds)
    STRICT_SITE_SCOPE: Strict Site Scope
    SESSION_SETTINGS: Session Retention Settings
    SESSION_RETENTION_DAYS: Chat Retention Period (Days)
    SESSION_RETENTION_DAYS_HELP: Number of days to retain visitor chat history & active state across pages, tabs, and refreshes (set 0 for session-only)
    LOGGING_SETTINGS: Logging & FAQ Analytics
    LOGGING_ENABLED: Enable Interaction Logging
    LOG_API_USAGE: Track Token Usage & Estimated Cost
    UI_SETTINGS: Chatbot Widget UI & Themes
    THEME_PRESET: UI Theme Preset
    THEME_PRESET_HELP: Select visual color theme styling
    WIDGET_POSITION: Floating Widget Position
    DISPLAY_MODE: Widget Display Visibility
    DISPLAY_MODE_HELP: Control which website pages show the chatbot widget (All Pages, Only Selected Pages, or Exclude Selected Pages)
    DISPLAY_PAGES: Page Routes (One per line)
    DISPLAY_PAGES_HELP: Enter route paths, e.g. / for home, /contact, /faq
    WELCOME_MESSAGE: Welcome Greeting
    ACCENT_COLOR: Custom Accent Color
    ACCENT_COLOR_HELP: Used when 'Custom Color Picker' theme is selected
    QUICK_REPLIES_ENABLED: Quick Reply Action Buttons
    QUICK_REPLIES_ENABLED_HELP: Shows quick reply suggestion pills above the chat input box
    QUICK_REPLIES: Customizable Quick Reply Buttons
    QUICK_REPLIES_HELP: Add or customize quick suggestion buttons (e.g. Summarize Page, Contact Owner, or custom question prompts)
    NOTIFICATION_ENABLED: Proactive Notification Toast
    NOTIFICATION_ENABLED_HELP: Shows pop-up message toast above launcher button
    NOTIFICATION_TEXT: Toast Notification Text
    NOTIFICATION_DELAY: Toast Delay (Seconds)
    COT_EMPTY_RESPONSE_TEXT: AI Unclear Response Message
    COT_EMPTY_RESPONSE_TEXT_HELP: Message shown when the AI could not generate a clear answer (e.g. nonsensical input).

id:
  PLUGIN_AI_CHATBOT:
    ENABLED: Aktif
    PROVIDER_SETTINGS: Pengaturan Penyedia AI
    AI_ENABLED: Aktifkan Fallback API AI
    AI_ENABLED_HELP: Jika dinonaktifkan, chatbot hanya memakai jawaban FAQ lokal dan tidak memanggil API AI.
    AI_DISABLED_RESPONSE_TEXT: Pesan Respons AI Nonaktif
    AI_DISABLED_RESPONSE_TEXT_HELP: Pesan balasan kustom untuk pengunjung saat tidak ada FAQ lokal yang cocok dan fallback API AI dinonaktifkan.
    PROVIDER: Mesin Penyedia AI
    PROVIDER_HELP: Pilih model penyedia AI pilihan Anda (Groq, Google Gemini, OpenRouter, OpenAI, atau Kustom)
    API_KEY: Kunci API
    API_KEY_HELP: Masukkan Kunci API penyedia Anda dengan aman (biarkan kosong untuk Ollama lokal / model yang di-host sendiri)
    MODEL: Identifikasi Model
    MODEL_HELP: Contoh gemini-2.0-flash, gemini-2.0-flash-lite, llama-3.3-70b-versatile, gpt-4o-mini
    CUSTOM_ENDPOINT: URL Endpoint Kustom
    CUSTOM_ENDPOINT_HELP: Contoh https://openrouter.ai/api/v1 (hanya diperlukan untuk penyedia Kustom)
    CUSTOM_SYSTEM_PROMPT: Prompt / Instruksi Sistem Kustom
    CUSTOM_SYSTEM_PROMPT_HELP: Instruksi sistem kustom untuk model AI. Jika dikosongkan, memakai aturan bawaan penekanan CoT dan batas karakter.
    MAX_RESPONSE_CHARS: Maksimum Karakter Respons (Batas Lunak)
    MAX_RESPONSE_CHARS_HELP: Panduan lunak untuk jumlah maksimum karakter balasan AI (bawaan 1000 karakter).
    TEST_CONNECTION: Uji Koneksi API AI
    TEST_CONNECTION_HELP: Uji kunci API dan konfigurasi model penyedia secara langsung sebelum menyimpan pengaturan
    FAQ_SETTINGS: Pengaturan Pra-Pencocokan FAQ
    FAQ_ENABLED: Aktifkan Pra-Pencocokan FAQ
    FAQ_ENABLED_HELP: Menjawab pertanyaan yang cocok dari halaman FAQ secara langsung tanpa memakai kunci API AI
    ENABLE_MULTILINGUAL_FAQ: Aktifkan Pencocokan FAQ Multibahasa
    ENABLE_MULTILINGUAL_FAQ_HELP: Otomatis memakai bahasa pengunjung untuk mencocokkan halaman FAQ yang dilokalkan (mis. faq.id.md, /id/faq)
    FAQ_ROUTE: Rute Halaman FAQ
    FAQ_ROUTE_HELP: Rute menuju halaman FAQ situs Anda (mis. /faq)
    FAQ_SIMILARITY: Sensitivitas Pencocokan FAQ (%)
    FAQ_SIMILARITY_HELP: Ambang skor kemiripan (50-100%) untuk mencocokkan pertanyaan pengguna dengan item FAQ
    CONTACT_SETTINGS: Pengaturan Resolusi Halaman Kontak
    CONTACT_ROUTE: Rute Halaman Kontak Publik
    CONTACT_ROUTE_HELP: Rute menuju halaman kontak publik (mis. /contact)
    ENABLE_HIDDEN_CONTACTS: Aktifkan Halaman Kontak Tersembunyi
    ENABLE_HIDDEN_CONTACTS_HELP: Membaca halaman kontak yang tidak dipublikasikan/tersembunyi untuk permintaan khusus (engineer, lead)
    HIDDEN_CONTACT_ROUTE: Rute Halaman Kontak Tersembunyi
    HIDDEN_CONTACT_ROUTE_HELP: Rute menuju halaman kontak tersembunyi (mis. /hidden-contacts)
    SECURITY_SETTINGS: Keamanan & Pembatasan Laju
    RATE_LIMIT_ENABLED: Aktifkan Pembatasan Laju per IP
    RATE_LIMIT_MAX: Maksimum Permintaan per Jendela
    RATE_LIMIT_WINDOW: Durasi Jendela (Detik)
    STRICT_SITE_SCOPE: Cakupan Situs Ketat
    SESSION_SETTINGS: Pengaturan Retensi Sesi
    SESSION_RETENTION_DAYS: Periode Retensi Obrolan (Hari)
    SESSION_RETENTION_DAYS_HELP: Jumlah hari penyimpanan riwayat obrolan dan status aktif pengunjung di seluruh halaman, tab, dan pemuatan ulang (isi 0 untuk sesi saja)
    LOGGING_SETTINGS: Log & Analitik FAQ
    LOGGING_ENABLED: Aktifkan Log Interaksi
    LOG_API_USAGE: Lacak Pemakaian Token & Estimasi Biaya
    UI_SETTINGS: UI & Tema Widget Chatbot
    THEME_PRESET: Preset Tema UI
    THEME_PRESET_HELP: Pilih gaya warna tema visual
    WIDGET_POSITION: Posisi Widget Mengambang
    DISPLAY_MODE: Visibilitas Tampilan Widget
    DISPLAY_MODE_HELP: Kendalikan halaman situs mana yang menampilkan widget chatbot (Semua Halaman, Hanya Halaman Terpilih, atau Kecualikan Halaman Terpilih)
    DISPLAY_PAGES: Rute Halaman (Satu per baris)
    DISPLAY_PAGES_HELP: Masukkan rute halaman, mis. / untuk beranda, /contact, /faq
    WELCOME_MESSAGE: Sapaan Selamat Datang
    ACCENT_COLOR: Warna Aksen Kustom
    ACCENT_COLOR_HELP: Digunakan saat tema 'Custom Color Picker' dipilih
    QUICK_REPLIES_ENABLED: Tombol Aksi Balasan Cepat
    QUICK_REPLIES_ENABLED_HELP: Menampilkan pil saran balasan cepat di atas kotak input obrolan
    QUICK_REPLIES: Tombol Balasan Cepat yang Dapat Dikustom
    QUICK_REPLIES_HELP: Tambah atau sesuaikan tombol saran cepat (mis. Ringkas Halaman, Kontak Pemilik, atau prompt pertanyaan kustom)
    NOTIFICATION_ENABLED: Notifikasi Toast Proaktif
    NOTIFICATION_ENABLED_HELP: Menampilkan pesan toast pop-up di atas tombol peluncur
    NOTIFICATION_TEXT: Teks Notifikasi Toast
    NOTIFICATION_DELAY: Jeda Toast (Detik)
    COT_EMPTY_RESPONSE_TEXT: Pesan Respons AI Tidak Jelas
    COT_EMPTY_RESPONSE_TEXT_HELP: Pesan yang ditampilkan saat AI tidak dapat menghasilkan jawaban yang jelas (mis. input tidak masuk akal).
