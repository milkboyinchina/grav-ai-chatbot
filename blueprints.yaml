name: Grav AI Chatbot
slug: ai-chatbot
type: plugin
version: 1.4.3
description: AI-powered chatbot plugin for Grav CMS supporting Groq (Ultra-Fast), Google Gemini, OpenRouter, and OpenAI with local FAQ pre-matching, multilingual support, multi-tier contact resolution, page summarization, rate-limiting, custom UI theme presets, proactive toasts, persistent chat session retention, customizable quick reply buttons, live API connection testing, blacklisted word safety guardrails, page visibility rules, and analytics reporting.
icon: robot
author:
  name: milkboyinchina
  email: milkboyinchina@users.noreply.github.com
homepage: https://github.com/milkboyinchina/grav-ai-chatbot
keywords: grav, plugin, ai, chatbot, groq, gemini, openrouter, openai, faq, rag, themes, session, quick-replies, test-connection, guardrail, blacklist
bugs: https://github.com/milkboyinchina/grav-ai-chatbot/issues
docs: https://github.com/milkboyinchina/grav-ai-chatbot/blob/main/README.md
license: GPL-3.0-or-later

dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_AI_CHATBOT.ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    section_provider:
      type: section
      title: PLUGIN_AI_CHATBOT.PROVIDER_SETTINGS
      underline: true
      fields:
        ai_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.AI_ENABLED
          help: PLUGIN_AI_CHATBOT.AI_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        ai_disabled_response_text:
          type: textarea
          label: PLUGIN_AI_CHATBOT.AI_DISABLED_RESPONSE_TEXT
          help: PLUGIN_AI_CHATBOT.AI_DISABLED_RESPONSE_TEXT_HELP
          rows: 2
          default: 'AI assistant is currently disabled. Please search our FAQ or contact site support for assistance.'

        provider:
          type: select
          label: PLUGIN_AI_CHATBOT.PROVIDER
          help: PLUGIN_AI_CHATBOT.PROVIDER_HELP
          default: groq
          options:
            groq: Groq API (Ultra-Fast Llama 3)
            gemini: Google Gemini API
            openrouter: OpenRouter API
            openai: OpenAI API
            ollama: Ollama Engine (Local / Remote Self-Hosted AI)
            custom: Custom OpenAI-Compatible Endpoint

        api_key:
          type: password
          label: PLUGIN_AI_CHATBOT.API_KEY
          help: PLUGIN_AI_CHATBOT.API_KEY_HELP (Leave blank for local Ollama)
          validate:
            required: false

        model:
          type: text
          label: PLUGIN_AI_CHATBOT.MODEL
          help: Model identifier (e.g. gemini-2.0-flash, gpt-4o-mini, llama3.2, mistral, deepseek-r1)
          default: gemini-2.0-flash

        custom_endpoint:
          type: text
          label: PLUGIN_AI_CHATBOT.CUSTOM_ENDPOINT
          help: Custom endpoint URL. Required for 'custom' provider. For 'ollama', leave blank for default local (http://localhost:11434) or enter remote Ollama host (e.g. http://192.168.1.50:11434).
          default: ''

        api_timeout:
          type: text
          label: ⏱️ AI Provider API Timeout (Seconds)
          help: Maximum HTTP execution time in seconds for AI provider responses (default 30 seconds, range 5-120)
          default: 30
          validate:
            type: int
            min: 5
            max: 120

        max_tokens:
          type: text
          label: 🔤 Max Output Tokens per Response
          help: Maximum completion tokens generated per AI reply (default 800 tokens, range 50-4000)
          default: 800
          validate:
            type: int
            min: 50
            max: 4000

        max_input_tokens:
          type: text
          label: 📥 Max Input Tokens (User Question Limit)
          help: Maximum allowed input tokens for user question (default 500 tokens, ~2000 characters). If exceeded, a warning message is displayed.
          default: 500
          validate:
            type: int
            min: 50
            max: 8000

        context_window_tokens:
          type: text
          label: 🪟 Model Context Window Limit (Tokens)
          help: Total token context window capacity of the AI model (default 8192 tokens, e.g. 8192, 16384, 128000)
          default: 8192
          validate:
            type: int
            min: 512
            max: 2000000

    section_faq:
      type: section
      title: PLUGIN_AI_CHATBOT.FAQ_SETTINGS
      underline: true
      fields:
        faq_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.FAQ_ENABLED
          help: PLUGIN_AI_CHATBOT.FAQ_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        enable_multilingual_faq:
          type: toggle
          label: PLUGIN_AI_CHATBOT.ENABLE_MULTILINGUAL_FAQ
          help: PLUGIN_AI_CHATBOT.ENABLE_MULTILINGUAL_FAQ_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        faq_route:
          type: text
          label: PLUGIN_AI_CHATBOT.FAQ_ROUTE
          help: PLUGIN_AI_CHATBOT.FAQ_ROUTE_HELP
          default: /faq

        faq_similarity_threshold:
          type: range
          label: PLUGIN_AI_CHATBOT.FAQ_SIMILARITY
          help: PLUGIN_AI_CHATBOT.FAQ_SIMILARITY_HELP
          default: 70
          validate:
            min: 50
            max: 100
            step: 5

    section_contact:
      type: section
      title: PLUGIN_AI_CHATBOT.CONTACT_SETTINGS
      underline: true
      fields:
        contact_route:
          type: text
          label: PLUGIN_AI_CHATBOT.CONTACT_ROUTE
          help: PLUGIN_AI_CHATBOT.CONTACT_ROUTE_HELP
          default: /contact

        enable_hidden_contacts:
          type: toggle
          label: PLUGIN_AI_CHATBOT.ENABLE_HIDDEN_CONTACTS
          help: PLUGIN_AI_CHATBOT.ENABLE_HIDDEN_CONTACTS_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        hidden_contact_route:
          type: text
          label: PLUGIN_AI_CHATBOT.HIDDEN_CONTACT_ROUTE
          help: PLUGIN_AI_CHATBOT.HIDDEN_CONTACT_ROUTE_HELP
          default: /hidden-contacts

    section_ui:
      type: section
      title: PLUGIN_AI_CHATBOT.UI_SETTINGS
      underline: true
      fields:
        theme_preset:
          type: select
          label: PLUGIN_AI_CHATBOT.THEME_PRESET
          help: PLUGIN_AI_CHATBOT.THEME_PRESET_HELP
          default: glass_blue
          options:
            glass_blue: Modern Glassmorphic Blue
            emerald_dark: Emerald Dark Mode
            purple_haze: Purple Haze Glass
            sunset_orange: Sunset Orange Vibrant
            custom: Custom Color Picker

        position:
          type: select
          label: PLUGIN_AI_CHATBOT.WIDGET_POSITION
          default: bottom-right
          options:
            bottom-right: Bottom Right
            bottom-left: Bottom Left

        display_mode:
          type: select
          label: 📱 Chatbot Widget Page Visibility Rule
          help: Choose where the floating chatbot widget will appear on your website (All Pages, Only Selected Pages, or Exclude Selected Pages).
          default: all
          options:
            all: Show Chatbot on ALL Pages (Default Recommended)
            selected_only: Show ONLY on Specific Selected Page Routes
            exclude_selected: Show Everywhere EXCEPT Selected Page Routes

        display_pages:
          type: textarea
          label: 📍 Specific Target Page Routes (One path per line)
          help: "What is this for?\nEnter relative URL page paths (one per line) where you want to show or hide the chatbot widget based on your visibility rule above.\n\nExamples of Page Routes:\n• / (or /home) = Main Website Home Page\n• /contact = Contact Us Page\n• /faq = Frequently Asked Questions Page\n• /blog = Blog Archive Page\n\nHow it works:\n- If 'Show ONLY on Specific Selected Page Routes' is chosen above, the chatbot WILL ONLY appear on the routes listed here.\n- If 'Show Everywhere EXCEPT Selected Page Routes' is chosen above, the chatbot WILL BE HIDDEN on the routes listed here."
          default: "/\n/home\n/contact\n/faq"
          rows: 5

        bot_title:
          type: text
          label: 🤖 Chatbot Header Window Title
          help: Title displayed in the top header bar of the chat widget window (default "Website Assistant")
          default: 'Website Assistant'

        welcome_message:
          type: text
          label: PLUGIN_AI_CHATBOT.WELCOME_MESSAGE
          default: 'Hello! How can I help you with this website today?'

        custom_error_message:
          type: text
          label: Custom Connection Error Response Message
          help: Custom message displayed in the chat window when a network connection or AI API error occurs
          default: 'An unexpected connection error occurred. Please try again later.'

        accent_color:
          type: colorpicker
          label: PLUGIN_AI_CHATBOT.ACCENT_COLOR
          help: PLUGIN_AI_CHATBOT.ACCENT_COLOR_HELP
          default: '#3b82f6'

        quick_replies_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.QUICK_REPLIES_ENABLED
          help: PLUGIN_AI_CHATBOT.QUICK_REPLIES_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        quick_replies:
          type: list
          label: PLUGIN_AI_CHATBOT.QUICK_REPLIES
          help: PLUGIN_AI_CHATBOT.QUICK_REPLIES_HELP
          style: vertical
          fields:
            label:
              type: text
              label: Button Label
              default: '📝 Summarize Page'
            type:
              type: select
              label: Action Type
              default: action
              options:
                action: Internal Action (summarize_page, contact)
                question: Question / Prompt Query
            action_or_prompt:
              type: text
              label: Action Name or Question Prompt
              default: 'summarize_page'

        notification_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_ENABLED
          help: PLUGIN_AI_CHATBOT.NOTIFICATION_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        notification_text:
          type: text
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_TEXT
          default: '👋 Hi there! Need help finding anything on our website?'

        notification_delay_seconds:
          type: text
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_DELAY
          default: 4

    section_session:
      type: section
      title: PLUGIN_AI_CHATBOT.SESSION_SETTINGS
      underline: true
      fields:
        session_retention_days:
          type: text
          label: PLUGIN_AI_CHATBOT.SESSION_RETENTION_DAYS
          help: PLUGIN_AI_CHATBOT.SESSION_RETENTION_DAYS_HELP
          default: 7

    section_security:
      type: section
      title: PLUGIN_AI_CHATBOT.SECURITY_SETTINGS
      underline: true
      fields:
        rate_limit_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_ENABLED
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        rate_limit_max_requests:
          type: text
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_MAX
          default: 10

        rate_limit_window_seconds:
          type: text
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_WINDOW
          default: 60

        strict_site_scope:
          type: toggle
          label: PLUGIN_AI_CHATBOT.STRICT_SITE_SCOPE
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        blacklist_filter_enabled:
          type: toggle
          label: 🚫 Enable Blacklisted Words Guardrail Filter
          help: Block visitor queries containing forbidden words or profanity before sending to AI API
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        blacklist_words:
          type: textarea
          label: 🚫 Blacklisted Words / Restricted Vocabulary List
          help: Enter restricted words, profanity, or forbidden topics (one per line or comma-separated).
          default: "spam\nscam\nhack\nexploit\nbypass\nadmin_password\nsecret_token\nleak\nporn\ncasino\ngambling\nillegal"
          rows: 6

        blacklist_response_text:
          type: textarea
          label: 🚫 Blacklisted Words Warning Response Message
          help: Custom response displayed to the visitor when a blacklisted word is detected.
          default: "⚠️ Safety Guardrail: Your message contains prohibited words or topics that violate our safety policy. Please rephrase your question using appropriate language."
          rows: 3

        export_require_auth:
          type: toggle
          label: 🔒 Restrict Export Downloads to Whitelisted Users
          help: Require user to be logged in to Grav Admin and listed in the user whitelist below before downloading CSV/JSON reports
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        export_allowed_users:
          type: textarea
          label: 👥 Whitelisted Usernames for Export Download
          help: Enter authorized usernames (one per line or comma-separated) allowed to download interaction logs. Example: admin, milkboy
          default: "admin\nmilkboy"

    section_logging:
      type: section
      title: PLUGIN_AI_CHATBOT.LOGGING_SETTINGS
      underline: true
      fields:
        logging_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.LOGGING_ENABLED
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        log_api_usage:
          type: toggle
          label: PLUGIN_AI_CHATBOT.LOG_API_USAGE
          help: Track Token Usage & Estimated Cost
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        log_ai_responses:
          type: toggle
          label: 🤖 Enable AI Server Response Logging
          help: Record full AI server response payloads to user/data/ai-chatbot/ai_responses.log (Disabled by default)
          highlight: 0
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        cost_input_token_price_per_m:
          type: text
          label: Input Token Price(USD) per 1 Million Token
          help: Price in USD per 1,000,000 Input / Prompt Tokens (e.g. Google Gemini 1.5 Flash = $0.15 per 1M)
          default: '0.15'

        cost_output_token_price_per_m:
          type: text
          label: Output Token Price(USD) per 1 Million Token
          help: Price in USD per 1,000,000 Output / Completion Tokens (e.g. Google Gemini 1.5 Flash = $0.60 per 1M)
          default: '0.60'

        cost_estimation_example:
          type: textarea
          label: 💡 Provider Token Pricing Example & Estimation Disclaimer
          help: Pricing formula guide and provider accuracy warning
          default: "💡 Provider Token Pricing Example (Google Gemini 1.5 Flash):\n• Input / Prompt Tokens: $0.15 per 1,000,000 tokens ($0.00015 / 1k)\n• Output / Completion Tokens: $0.60 per 1,000,000 tokens ($0.00060 / 1k)\n\n⚠️ Token Cost Estimation Warning:\nEstimated API cost = (Prompt Tokens / 1,000,000 × $0.15) + (Completion Tokens / 1,000,000 × $0.60).\nPlease note that token cost estimates are approximations for general guidance. Actual billing may vary depending on model pricing updates, system prompt caching, image inputs, or free tier credits. Please refer to your AI provider's official dashboard for exact billing statements."
          rows: 7
          readonly: true
          ignore: true

        ai_chatbot_error_log_display:
          type: textarea
          label: 🚨 AI Chatbot Live Error Log
          help: Live error log entries recorded by the AI Chatbot plugin
          default: "No error logs recorded. Plugin operating normally."
          rows: 8
          readonly: true
          classes: grav-chatbot-error-log-field
          ignore: true

        ai_chatbot_error_log_location:
          type: textarea
          label: 📁 Error Log File Location & Deleting Instructions
          help: Information on where error log files are stored and how to edit or clear error data.
          default: "📁 Log File Path: user/data/ai-chatbot/error.log\nAbsolute Path: /var/www/html/user/data/ai-chatbot/error.log\n\n📝 Manual Error Log Editing & Deleting Instructions:\n• To view, edit, or prune error log entries, open 'user/data/ai-chatbot/error.log' in any text editor.\n• To clear all error logs, delete the file or empty its contents. The plugin will automatically recreate an empty log file when new errors occur."
          rows: 5
          readonly: true
          ignore: true

    section_analytics:
      type: section
      title: AI Analytics & Performance Dashboard
      underline: true
      fields:
        regenerate_metrics_button:
          type: display
          label: 🔄 Live Dashboard Metrics & Automatic Sync
          markdown: true
          content: '<div style="margin-top: 5px;"><button type="button" id="grav-chatbot-regenerate-btn" class="button btn btn-primary" style="background:#3b82f6; color:#fff; font-weight:600; padding:8px 16px; border-radius:6px; border:none; cursor:pointer;"><i class="fa fa-refresh"></i> 🔄 Update & Regenerate Chart Metrics</button></div><div id="grav-chatbot-regenerate-status" style="margin-top:10px; display:none; padding:10px 14px; border-radius:6px; font-weight:600;"></div><script>(function(){function findTargetElement(cssClass,keywords,elementType){var typeSelector=elementType||"*";if(cssClass){var directEl=document.querySelector("."+cssClass+" "+typeSelector+", "+typeSelector+"."+cssClass);if(directEl)return directEl}if(!Array.isArray(keywords))keywords=[keywords];for(var i=0;i<keywords.length;i++){var kw=keywords[i];var el=document.querySelector(typeSelector+"[name*=\""+kw+"\"]");if(el)return el}for(var j=0;j<keywords.length;j++){var kw=keywords[j];var el=document.querySelector(typeSelector+"[id*=\""+kw+"\"]");if(el)return el}var candidates=Array.from(document.querySelectorAll(typeSelector));for(var k=0;k<candidates.length;k++){var candidate=candidates[k];var fieldBlock=candidate.closest(".form-field, .form-group");if(fieldBlock){var labelEl=fieldBlock.querySelector(".form-label, label");if(labelEl){var text=labelEl.innerText||labelEl.textContent||"";for(var m=0;m<keywords.length;m++){if(text.toLowerCase().indexOf(keywords[m].toLowerCase())!==-1)return candidate}}}}return null}function updateFormFields(data){if(!data)return;var errorLogTextarea=findTargetElement("grav-chatbot-error-log-field",["ai_chatbot_error_log_display","error_log_display","live error log"],"textarea");if(errorLogTextarea&&typeof data.error_logs==="string"){errorLogTextarea.value=data.error_logs;errorLogTextarea.dispatchEvent(new Event("input",{bubbles:true}));errorLogTextarea.dispatchEvent(new Event("change",{bubbles:true}))}var summaryInput=findTargetElement("grav-chatbot-summary-field",["analytics_summary_text","summary_text","summary metrics"],"input")||findTargetElement("grav-chatbot-summary-field",["analytics_summary_text","summary_text"],"textarea");if(summaryInput&&data.summary){var s=data.summary;var totalQueries=s.total_queries||0;var faqHits=s.faq_hits||0;var aiHits=s.ai_hits||0;var totalTokens=(s.total_tokens||0).toLocaleString();var totalCost=(s.total_cost_usd||0).toFixed(4);var faqPct=totalQueries>0?Math.round((faqHits/totalQueries)*100):0;summaryInput.value="Total Queries: "+totalQueries+" | FAQ Matches: "+faqHits+" ("+faqPct+"% Saved) | AI Calls: "+aiHits+" | Total Tokens: "+totalTokens+" | Est. Cost: $"+totalCost;summaryInput.dispatchEvent(new Event("input",{bubbles:true}));summaryInput.dispatchEvent(new Event("change",{bubbles:true}))}var chartTextarea=findTargetElement("grav-chatbot-chart-field",["analytics_chart_display","chart_display","source distribution chart"],"textarea");if(chartTextarea&&data.daily_chart){var labels=data.daily_chart.labels||[];var values=data.daily_chart.values||[];var maxVal=Math.max(1,Math.max.apply(null,values.length?values:[1]));var lines=["📈 DAILY INTERACTION VOLUME:"];if(labels.length===0){lines.push("  (No interaction data logged yet)")}else{var slicedL=labels.length>25?labels.slice(labels.length-25):labels;var slicedV=values.length>25?values.slice(values.length-25):values;slicedL.forEach(function(l,idx){var v=slicedV[idx];var len=Math.max(1,Math.round((v/maxVal)*20));lines.push("  "+l+" : "+"█".repeat(len)+" ("+v+" queries)")})}if(data.ratio_chart){var f=data.ratio_chart.faq_hits||0;var a=data.ratio_chart.ai_hits||0;var r=data.ratio_chart.rate_limit_hits||0;var tot=f+a+r||1;var fp=Math.round((f/tot)*100);var ap=Math.round((a/tot)*100);var rp=Math.round((r/tot)*100);lines.push("");lines.push("📊 QUERY SOURCE DISTRIBUTION RATIO:");lines.push("  ⚡ FAQ Matches (Free) : "+"█".repeat(Math.max(0,Math.round((fp/100)*20)))+" "+f+" ("+fp+"%)");lines.push("  🤖 AI Model Calls     : "+"█".repeat(Math.max(0,Math.round((ap/100)*20)))+" "+a+" ("+ap+"%)");lines.push("  🛡️ Rate Limit Shield  : "+"█".repeat(Math.max(0,Math.round((rp/100)*20)))+" "+r+" ("+rp+"%)")}chartTextarea.value=lines.join("\n");chartTextarea.dispatchEvent(new Event("input",{bubbles:true}));chartTextarea.dispatchEvent(new Event("change",{bubbles:true}))}var recsTextarea=findTargetElement("grav-chatbot-recs-field",["analytics_recommendations_text","recommendations_text","candidate faq"],"textarea");if(recsTextarea&&data.recommendations){var recs=data.recommendations||[];if(recs.length===0){recsTextarea.value="No candidate FAQ recommendations at this time. All interactions logged in user/data/ai-chatbot/interactions.json."}else{var recLines=recs.map(function(rec){return"• ["+rec.count+"x asked] Q: "+rec.sample_question+" => A: "+rec.suggested_answer.substring(0,100)+"..."});recsTextarea.value=recLines.join("\n\n")}recsTextarea.dispatchEvent(new Event("input",{bubbles:true}));recsTextarea.dispatchEvent(new Event("change",{bubbles:true}))}}function doPoll(){fetch("/chatbot-api?t="+Date.now(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"analytics_report"})}).then(function(res){return res.json()}).then(function(resData){if(resData.success&&resData.analytics){updateFormFields(resData.analytics)}}).catch(function(err){})}doPoll();if(!window.GravChatbotPoller){window.GravChatbotPoller=setInterval(doPoll,2000)}})();</script>'
          ignore: true

        analytics_summary_text:
          type: text
          label: 📊 Interaction Summary Metrics
          default: "Total Queries: 0 | FAQ Matches: 0 (0% Saved) | AI Calls: 0 | Total Tokens: 0 | Est. Cost: $0.0000"
          readonly: true
          classes: grav-chatbot-summary-field
          ignore: true

        analytics_chart_display:
          type: textarea
          label: 📈 Visual Interaction Volume & Source Distribution Chart
          help: Visual bar graphs of daily interaction volume and FAQ vs AI hit ratios
          default: "📈 DAILY INTERACTION VOLUME:\n  (No interaction data logged yet)\n\n📊 QUERY SOURCE DISTRIBUTION RATIO:\n  ⚡ FAQ Matches (Free) : 0 (0%)\n  🤖 AI Model Calls     : 0 (0%)\n  🛡️ Rate Limit Shield  : 0 (0%)"
          rows: 9
          readonly: true
          classes: grav-chatbot-chart-field
          ignore: true

        download_csv_link:
          type: text
          label: 📥 Full CSV Report Download URL
          default: http://localhost/chatbot-export?format=csv
          help: Full absolute URL to download CSV spreadsheet report.
          readonly: true
          ignore: true

        download_json_link:
          type: text
          label: 📄 Full JSON Analytics Dataset Download URL
          default: http://localhost/chatbot-export?format=json
          help: Full absolute URL to download JSON telemetry dataset.
          readonly: true
          ignore: true

        download_raw_link:
          type: text
          label: 💾 Full Raw Interactions Log Download URL
          default: http://localhost/chatbot-export?format=raw_interactions
          help: Full absolute URL to download complete raw interaction entries.
          readonly: true
          ignore: true

        analytics_data_file_location:
          type: textarea
          label: 📁 Telemetry Log File Location & Editing Instructions
          help: Information on where interaction log files are stored and how to edit or delete data.
