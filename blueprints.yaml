name: Grav AI Chatbot
slug: ai-chatbot
type: plugin
version: 1.4.3
description: AI-powered chatbot plugin for Grav CMS supporting Groq (Ultra-Fast), Google Gemini, OpenRouter, and OpenAI with local FAQ pre-matching, multilingual support, multi-tier contact resolution, page summarization, rate-limiting, custom UI theme presets, proactive toasts, persistent chat session retention, customizable quick reply buttons, live API connection testing, blacklisted word safety guardrails, page visibility rules, and analytics reporting.
icon: robot
author:
  name: milkboyinchina
  email: milkboyinchina@users.noreply.github.com
homepage: https://github.com/milkboyinchina/grav-ai-chatbot
keywords: grav, plugin, ai, chatbot, groq, gemini, openrouter, openai, faq, rag, themes, session, quick-replies, test-connection, guardrail, blacklist
bugs: https://github.com/milkboyinchina/grav-ai-chatbot/issues
docs: https://github.com/milkboyinchina/grav-ai-chatbot/blob/main/README.md
license: GPL-3.0-or-later

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    manual_notice:
      type: display
      label: 📖 Documentation & Setup Guide
      markdown: true
      content: '> 💡 **Encountering any difficulties?** Please read the detailed **[Grav AI Chatbot Official User Manual (MANUAL.md)](https://github.com/milkboyinchina/grav-ai-chatbot/blob/main/MANUAL.md)** on GitHub for complete step-by-step setup guides, field dependencies, RAG vector store options, and server cron setup.'
      ignore: true

    enabled:
      type: toggle
      label: PLUGIN_AI_CHATBOT.ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    section_provider:
      type: section
      title: PLUGIN_AI_CHATBOT.PROVIDER_SETTINGS
      underline: true
      fields:
        ai_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.AI_ENABLED
          help: PLUGIN_AI_CHATBOT.AI_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        ai_disabled_response_text:
          type: textarea
          label: PLUGIN_AI_CHATBOT.AI_DISABLED_RESPONSE_TEXT
          help: PLUGIN_AI_CHATBOT.AI_DISABLED_RESPONSE_TEXT_HELP
          rows: 2
          default: 'AI assistant is currently disabled. Please search our FAQ or contact site support for assistance.'

        provider:
          type: select
          label: 🤖 AI Provider Engine
          help: Select your preferred AI provider
          default: omniroute
          options:
            omniroute: 🤖 Custom OpenAI-Compatible
            ollama: 🦙 Ollama Local Host (v1 / Chat)
            groq: ⚡ Groq Cloud (Llama-3.3-70b / Fast)
            openrouter: 🌐 OpenRouter AI Gateway
            openai: 🤖 OpenAI Official API (GPT-4o / GPT-4o-mini)
            gemini: ♊ Google Gemini API

        api_key:
          type: text
          label: PLUGIN_AI_CHATBOT.API_KEY
          help: PLUGIN_AI_CHATBOT.API_KEY_HELP
          placeholder: 'Enter API Key or Secret Token (optional for local endpoints)...'
          validate:
            required: false

        model:
          type: text
          label: PLUGIN_AI_CHATBOT.MODEL
          help: Model identifier (e.g. gemini-3.1-flash-lite, gpt-4o-mini, llama3.3, mistral, deepseek-r1)
          default: gemini-3.1-flash-lite

        model_operations:
          type: chatbot-model-tools
          label: 🛠️ Model Tools & Live Health Check
          help: Retrieve active models from provider API and perform live model health checks.

        custom_endpoint:
          type: text
          label: 🌐 OpenAI Compatible URL
          help: Primary endpoint URL when using Custom OpenAI-Compatible (e.g. http://110.120.130.140:20128). Mandatory for Custom OpenAI-Compatible.
          default: http://110.120.130.140:20128
          placeholder: http://110.120.130.140:20128
          show_on: "provider: omniroute,ollama,custom"
          validate:
            required: false

        fallback_endpoint:
          type: text
          label: 🔄 Fallback Endpoint URL
          help: Not required. Leave Blank if Not Needed
          placeholder: Not required. Leave Blank if Not Needed
          default: ''
          show_on: "provider: omniroute,ollama,custom"
          validate:
            required: false

        api_timeout:
          type: text
          label: ⏱️ AI Provider API Timeout (Seconds)
          help: Maximum HTTP execution time in seconds for AI provider responses (default 30 seconds, range 5-120)
          default: 30
          validate:
            type: int
            min: 5
            max: 120

        max_tokens:
          type: text
          label: 🔤 Max Output Tokens per Response
          help: Maximum completion tokens generated per AI reply (default 800 tokens, range 50-4000)
          default: 800
          validate:
            type: int
            min: 50
            max: 4000

        max_input_tokens:
          type: text
          label: 📥 Max Input Tokens (User Question Limit)
          help: Maximum allowed input tokens for user question (default 500 tokens, ~2000 characters). If exceeded, a warning message is displayed.
          default: 500
          validate:
            type: int
            min: 50
            max: 8000

        context_window_tokens:
          type: text
          label: 🪟 Model Context Window Limit (Tokens)
          help: Total token context window capacity of the AI model (default 8192 tokens, e.g. 8192, 16384, 128000)
          default: 8192

        custom_system_prompt:
          type: textarea
          label: 📜 Custom System Prompt / Instructions
          help: Custom system rules for AI model. Leave blank to use default CoT suppression and character limit rules. Use {max_response_chars} as placeholder for soft limit.
          default: "Answer the user directly. Do not include any thinking process, reasoning steps, scratchpad, or internal monologue. Keep your total response under approximately {max_response_chars} characters."

        max_response_chars:
          type: text
          label: 📏 Max Response Characters (Soft Limit)
          help: Soft guidance for maximum characters in AI replies (default 1000 characters).
          default: 1000
          validate:
            type: int
            min: 100
            max: 20000
          validate:
            type: int
            min: 512
            max: 2000000

    section_rag:
      type: section
      title: 🧠 RAG (Retrieval-Augmented Generation) & Page Indexing Engine
      underline: true
      fields:
        rag_enabled:
          type: toggle
          label: 🧠 Enable RAG Vector Retrieval Search
          help: Use vector similarity search to retrieve relevant page chunks for AI answers. If disabled, uses legacy site summary context.
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        rag_indexing_enabled:
          type: toggle
          label: ⚡ Enable Automatic Page Indexing
          help: Enable automatic page parsing and vector embedding generation on page save, page deletion, and background cron runs.
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        rag_embedding_provider:
          type: select
          label: 🧩 RAG Embedding Provider Engine
          help: Select driver for generating text vector embeddings (Ollama local, Gemini, OpenAI, or Local TF-IDF keyword fallback)
          default: tfidf_local
          options:
            tfidf_local: ⚡ Local TF-IDF / BM25 Inverted Index (Free / No External API Needed)
            ollama: 🦙 Ollama Local Embeddings (nomic-embed-text / mxbai-embed-large)
            gemini: ♊ Google Gemini Embeddings (text-embedding-004)
            openai: 🤖 OpenAI / OpenRouter Embeddings (text-embedding-3-small)

        rag_embedding_model:
          type: text
          label: 🏷️ Embedding Model Identifier
          help: Embedding model name (e.g. nomic-embed-text, text-embedding-004, text-embedding-3-small)
          default: 'tfidf_local'

        rag_top_k:
          type: text
          label: 🎯 Top-K Chunks to Retrieve
          help: Number of relevant page chunks to inject into the prompt context per query (Default 3, Range 1-10)
          default: 3
          validate:
            type: int
            min: 1
            max: 10

        rag_min_similarity:
          type: text
          label: 📊 Minimum Similarity Threshold (%)
          help: Minimum similarity score required to include a page chunk (Default 65%)
          default: 65
          validate:
            type: int
            min: 10
            max: 100

        rag_scheduler_enabled:
          type: toggle
          label: ⏰ Enable Background Scheduled Re-indexing
          help: Automatically re-index Grav pages in the background via Grav CMS Scheduler
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        rag_scheduler_cron:
          type: text
          label: 🕒 Scheduled Cron Expression
          help: Standard 5-field cron expression for background re-indexing (Default "0 2 * * *" = Daily at 2:00 AM)
          default: '0 2 * * *'

        rebuild_rag_index_button:
          type: display
          label: ⚡ Manual RAG Index Operations
          markdown: true
          content: '<div style="margin-top: 5px;"><button type="button" id="grav-chatbot-rebuild-rag-btn" class="button btn btn-primary" style="background:#10b981; color:#fff; font-weight:600; padding:8px 16px; border-radius:6px; border:none; cursor:pointer;"><i class="fa fa-database"></i> ⚡ Rebuild RAG Vector Index Now</button></div><div id="grav-chatbot-rag-status" style="margin-top:10px; display:none; padding:10px 14px; border-radius:6px; font-weight:600;"></div><script>(function(){var btn=document.getElementById("grav-chatbot-rebuild-rag-btn");var statusEl=document.getElementById("grav-chatbot-rag-status");if(btn){btn.addEventListener("click",function(){btn.disabled=true;statusEl.style.display="block";statusEl.style.background="#f3f4f6";statusEl.style.color="#1f2937";statusEl.innerHTML="⏳ Rebuilding RAG Vector Index... Please wait.";fetch("/chatbot-api?t="+Date.now(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"rebuild_rag_index"})}).then(function(res){return res.json()}).then(function(data){btn.disabled=false;if(data.success){statusEl.style.background="#d1fae5";statusEl.style.color="#065f46";statusEl.innerHTML="✅ "+data.message}else{statusEl.style.background="#fee2e2";statusEl.style.color="#991b1b";statusEl.innerHTML="❌ Indexing Error: "+(data.error||data.message||"Failed")}}).catch(function(err){btn.disabled=false;statusEl.style.background="#fee2e2";statusEl.style.color="#991b1b";statusEl.innerHTML="❌ Connection Error: "+err.message})})}})();</script>'
          ignore: true

    section_faq:
      type: section
      title: PLUGIN_AI_CHATBOT.FAQ_SETTINGS
      underline: true
      fields:
        faq_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.FAQ_ENABLED
          help: PLUGIN_AI_CHATBOT.FAQ_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        enable_multilingual_faq:
          type: toggle
          label: PLUGIN_AI_CHATBOT.ENABLE_MULTILINGUAL_FAQ
          help: PLUGIN_AI_CHATBOT.ENABLE_MULTILINGUAL_FAQ_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        faq_route:
          type: text
          label: PLUGIN_AI_CHATBOT.FAQ_ROUTE
          help: PLUGIN_AI_CHATBOT.FAQ_ROUTE_HELP
          default: /faq

        faq_similarity_threshold:
          type: range
          label: PLUGIN_AI_CHATBOT.FAQ_SIMILARITY
          help: PLUGIN_AI_CHATBOT.FAQ_SIMILARITY_HELP
          default: 70
          validate:
            min: 50
            max: 100
            step: 5

    section_contact:
      type: section
      title: PLUGIN_AI_CHATBOT.CONTACT_SETTINGS
      underline: true
      fields:
        contact_route:
          type: text
          label: PLUGIN_AI_CHATBOT.CONTACT_ROUTE
          help: PLUGIN_AI_CHATBOT.CONTACT_ROUTE_HELP
          default: /contact

        enable_hidden_contacts:
          type: toggle
          label: PLUGIN_AI_CHATBOT.ENABLE_HIDDEN_CONTACTS
          help: PLUGIN_AI_CHATBOT.ENABLE_HIDDEN_CONTACTS_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        hidden_contact_route:
          type: text
          label: PLUGIN_AI_CHATBOT.HIDDEN_CONTACT_ROUTE
          help: PLUGIN_AI_CHATBOT.HIDDEN_CONTACT_ROUTE_HELP
          default: /hidden-contacts

    section_ui:
      type: section
      title: PLUGIN_AI_CHATBOT.UI_SETTINGS
      underline: true
      fields:
        theme_preset:
          type: select
          label: PLUGIN_AI_CHATBOT.THEME_PRESET
          help: PLUGIN_AI_CHATBOT.THEME_PRESET_HELP
          default: glass_blue
          options:
            glass_blue: Modern Glassmorphic Blue
            emerald_dark: Emerald Dark Mode
            purple_haze: Purple Haze Glass
            sunset_orange: Sunset Orange Vibrant
            custom: Custom Color Picker

        position:
          type: select
          label: PLUGIN_AI_CHATBOT.WIDGET_POSITION
          default: bottom-right
          options:
            bottom-right: Bottom Right
            bottom-left: Bottom Left

        display_mode:
          type: select
          label: 📱 Chatbot Widget Page Visibility Rule
          help: Choose where the floating chatbot widget will appear on your website (All Pages, Only Selected Pages, or Exclude Selected Pages).
          default: all
          options:
            all: Show Chatbot on ALL Pages (Default Recommended)
            selected_only: Show ONLY on Specific Selected Page Routes
            exclude_selected: Show Everywhere EXCEPT Selected Page Routes

        display_pages:
          type: textarea
          label: 📍 Specific Target Page Routes (One path per line)
          help: "What is this for?\nEnter relative URL page paths (one per line) where you want to show or hide the chatbot widget based on your visibility rule above.\n\nExamples of Page Routes:\n• / (or /home) = Main Website Home Page\n• /contact = Contact Us Page\n• /faq = Frequently Asked Questions Page\n• /blog = Blog Archive Page\n\nHow it works:\n- If 'Show ONLY on Specific Selected Page Routes' is chosen above, the chatbot WILL ONLY appear on the routes listed here.\n- If 'Show Everywhere EXCEPT Selected Page Routes' is chosen above, the chatbot WILL BE HIDDEN on the routes listed here."
          default: "/\n/home\n/contact\n/faq"
          rows: 5

        bot_title:
          type: text
          label: 🤖 Chatbot Header Window Title
          help: Title displayed in the top header bar of the chat widget window (default "Website Assistant")
          default: 'Website Assistant'

        welcome_message:
          type: text
          label: PLUGIN_AI_CHATBOT.WELCOME_MESSAGE
          default: 'Hello! How can I help you with this website today?'

        custom_error_message:
          type: text
          label: Custom Connection Error Response Message
          help: Custom message displayed in the chat window when a network connection or AI API error occurs
          default: 'An unexpected connection error occurred. Please try again later.'

        cot_empty_response_text:
          type: text
          label: 🤖 AI Unclear Response Message
          help: Message shown when the AI could not generate a clear answer (e.g. nonsensical input). Leave blank to use default.
          default: "I'm sorry, I didn't quite understand that. Could you please rephrase your question?"

        accent_color:
          type: colorpicker
          label: PLUGIN_AI_CHATBOT.ACCENT_COLOR
          help: PLUGIN_AI_CHATBOT.ACCENT_COLOR_HELP
          default: '#3b82f6'

        quick_replies_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.QUICK_REPLIES_ENABLED
          help: PLUGIN_AI_CHATBOT.QUICK_REPLIES_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        quick_replies:
          type: list
          label: PLUGIN_AI_CHATBOT.QUICK_REPLIES
          help: PLUGIN_AI_CHATBOT.QUICK_REPLIES_HELP
          style: vertical
          fields:
            label:
              type: text
              label: Button Label
              default: '📝 Summarize Page'
            type:
              type: select
              label: Action Type
              default: action
              options:
                action: Internal Action (summarize_page, contact)
                question: Question / Prompt Query
            action_or_prompt:
              type: text
              label: Action Name or Question Prompt
              default: 'summarize_page'

        notification_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_ENABLED
          help: PLUGIN_AI_CHATBOT.NOTIFICATION_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        notification_text:
          type: text
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_TEXT
          default: '👋 Hi there! Need help finding anything on our website?'

        notification_delay_seconds:
          type: text
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_DELAY
          default: 4

    section_session:
      type: section
      title: PLUGIN_AI_CHATBOT.SESSION_SETTINGS
      underline: true
      fields:
        session_retention_days:
          type: text
          label: PLUGIN_AI_CHATBOT.SESSION_RETENTION_DAYS
          help: PLUGIN_AI_CHATBOT.SESSION_RETENTION_DAYS_HELP
          default: 7

    section_security:
      type: section
      title: PLUGIN_AI_CHATBOT.SECURITY_SETTINGS
      underline: true
      fields:
        rate_limit_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_ENABLED
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        rate_limit_max_requests:
          type: text
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_MAX
          default: 10

        rate_limit_window_seconds:
          type: text
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_WINDOW
          default: 60

        strict_site_scope:
          type: toggle
          label: PLUGIN_AI_CHATBOT.STRICT_SITE_SCOPE
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        blacklist_filter_enabled:
          type: toggle
          label: 🚫 Enable Blacklisted Words Guardrail Filter
          help: Block visitor queries containing forbidden words or profanity before sending to AI API
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        blacklist_words:
          type: textarea
          label: 🚫 Blacklisted Words / Restricted Vocabulary List
          help: Enter restricted words, profanity, or forbidden topics (one per line or comma-separated).
          default: "spam\nscam\nhack\nexploit\nbypass\nadmin_password\nsecret_token\nleak\nporn\ncasino\ngambling\nillegal"
          rows: 6

        blacklist_response_text:
          type: textarea
          label: 🚫 Blacklisted Words Warning Response Message
          help: Custom response displayed to the visitor when a blacklisted word is detected.
          default: "⚠️ Safety Guardrail: Your message contains prohibited words or topics that violate our safety policy. Please rephrase your question using appropriate language."
          rows: 3

        export_require_auth:
          type: toggle
          label: 🔒 Restrict Export Downloads to Whitelisted Users
          help: Require user to be logged in to Grav Admin and listed in the user whitelist below before downloading CSV/JSON reports
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        export_allowed_users:
          type: textarea
          label: 👥 Whitelisted Usernames for Export Download
          help: "Enter authorized usernames (one per line or comma-separated) allowed to download interaction logs. Example: admin, milkboy"
          default: "admin\nmilkboy"

        ai_chatbot_security_logs_display:
          type: chatbot-security-logs
          label: 🛡️ Real-Time Security & Threat Audit Dashboard
          help: Live security violation audit logs, active IP lockouts, and threat status.

    section_logging:
      type: section
      title: PLUGIN_AI_CHATBOT.LOGGING_SETTINGS
      underline: true
      fields:
        logging_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.LOGGING_ENABLED
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        log_api_usage:
          type: toggle
          label: PLUGIN_AI_CHATBOT.LOG_API_USAGE
          help: Track Token Usage & Estimated Cost
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        log_ai_responses:
          type: toggle
          label: 🤖 Enable AI Server Response Logging
          help: Record full AI server response payloads to user/data/ai-chatbot/ai_responses.log (Disabled by default)
          highlight: 0
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        cost_input_token_price_per_m:
          type: text
          label: Input Token Price(USD) per 1 Million Token
          help: Price in USD per 1,000,000 Input / Prompt Tokens (e.g. Google Gemini 1.5 Flash = $0.15 per 1M)
          default: '0.15'

        cost_output_token_price_per_m:
          type: text
          label: Output Token Price(USD) per 1 Million Token
          help: Price in USD per 1,000,000 Output / Completion Tokens (e.g. Google Gemini 1.5 Flash = $0.60 per 1M)
          default: '0.60'

        cost_estimation_example:
          type: textarea
          label: 💡 Provider Token Pricing Example & Estimation Disclaimer
          help: Pricing formula guide and provider accuracy warning
          default: "💡 Provider Token Pricing Example (Google Gemini 1.5 Flash):\n• Input / Prompt Tokens: $0.15 per 1,000,000 tokens ($0.00015 / 1k)\n• Output / Completion Tokens: $0.60 per 1,000,000 tokens ($0.00060 / 1k)\n\n⚠️ Token Cost Estimation Warning:\nEstimated API cost = (Prompt Tokens / 1,000,000 × $0.15) + (Completion Tokens / 1,000,000 × $0.60).\nPlease note that token cost estimates are approximations for general guidance. Actual billing may vary depending on model pricing updates, system prompt caching, image inputs, or free tier credits. Please refer to your AI provider's official dashboard for exact billing statements."
          rows: 7
          readonly: true
          ignore: true


        ai_chatbot_error_log_location:
          type: textarea
          label: 📁 Error Log File Location & Deleting Instructions
          help: Information on where error log files are stored and how to edit or clear error data.
          default: "📁 Log File Path: user/data/ai-chatbot/error.log\nAbsolute Path: /var/www/html/user/data/ai-chatbot/error.log\n\n📝 Manual Error Log Editing & Deleting Instructions:\n• To view, edit, or prune error log entries, open 'user/data/ai-chatbot/error.log' in any text editor.\n• To clear all error logs, delete the file or empty its contents. The plugin will automatically recreate an empty log file when new errors occur."
          rows: 5
          readonly: true
          ignore: true

    section_analytics:
      type: section
      title: AI Analytics & Performance Dashboard
      underline: true
      fields:
        analytics_live_metrics:
          type: chatbot-metrics
          label: 📊 Real-Time Interaction Metrics & Analytics
          help: Live visual analytics metrics powered by custom Admin 2 Web Component.

        download_csv_link:
          type: text
          label: 📥 Full CSV Report Download URL
          default: /chatbot-export?format=csv
          help: Full absolute or relative URL to download CSV spreadsheet report.
          readonly: true
          ignore: true
          validate:
            type: ignore

        download_json_link:
          type: text
          label: 📄 Full JSON Analytics Dataset Download URL
          default: /chatbot-export?format=json
          help: Full absolute or relative URL to download JSON telemetry dataset.
          readonly: true
          ignore: true
          validate:
            type: ignore

        download_raw_link:
          type: text
          label: 💾 Full Raw Interactions Log Download URL
          default: /chatbot-export?format=raw_interactions
          help: Full absolute or relative URL to download complete raw interaction entries.
          readonly: true
          ignore: true
          validate:
            type: ignore

        analytics_data_file_location:
          type: textarea
          label: 📁 Telemetry Log File Location & Editing Instructions
          help: Information on where interaction log files are stored and how to edit or delete data.
