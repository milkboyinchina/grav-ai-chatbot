name: Grav AI Chatbot
slug: ai-chatbot
type: plugin
version: 1.1.4
description: AI-powered chatbot plugin for Grav CMS supporting Groq (Ultra-Fast), Google Gemini, OpenRouter, and OpenAI with local FAQ pre-matching, multilingual support, multi-tier contact resolution, page summarization, rate-limiting, custom UI theme presets, proactive toasts, persistent chat session retention, customizable quick reply buttons, live API connection testing, and analytics reporting.
icon: robot
author:
  name: milkboyinchina
  email: milkboyinchina@users.noreply.github.com
homepage: https://github.com/milkboyinchina/grav-ai-chatbot
keywords: grav, plugin, ai, chatbot, groq, gemini, openrouter, openai, faq, rag, themes, session, quick-replies, test-connection
bugs: https://github.com/milkboyinchina/grav-ai-chatbot/issues
docs: https://github.com/milkboyinchina/grav-ai-chatbot/blob/main/README.md
license: GPL-3.0-or-later

dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_AI_CHATBOT.ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    section_provider:
      type: section
      title: PLUGIN_AI_CHATBOT.PROVIDER_SETTINGS
      underline: true
      fields:
        ai_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.AI_ENABLED
          help: PLUGIN_AI_CHATBOT.AI_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        provider:
          type: select
          label: PLUGIN_AI_CHATBOT.PROVIDER
          help: PLUGIN_AI_CHATBOT.PROVIDER_HELP
          default: groq
          options:
            groq: Groq API (Ultra-Fast Llama 3)
            gemini: Google Gemini API
            openrouter: OpenRouter API
            openai: OpenAI API
            custom: Custom OpenAI-Compatible Endpoint

        api_key:
          type: password
          label: PLUGIN_AI_CHATBOT.API_KEY
          help: PLUGIN_AI_CHATBOT.API_KEY_HELP
          validate:
            required: false

        model:
          type: text
          label: PLUGIN_AI_CHATBOT.MODEL
          help: PLUGIN_AI_CHATBOT.MODEL_HELP
          default: llama-3.3-70b-versatile

        custom_endpoint:
          type: text
          label: PLUGIN_AI_CHATBOT.CUSTOM_ENDPOINT
          help: PLUGIN_AI_CHATBOT.CUSTOM_ENDPOINT_HELP
          default: ''

        test_api_button:
          type: display
          label: PLUGIN_AI_CHATBOT.TEST_CONNECTION
          help: PLUGIN_AI_CHATBOT.TEST_CONNECTION_HELP
          markdown: true
          content: '<div class="button-bar" style="margin-top: 15px;"><button type="button" id="grav-chatbot-test-api-btn" class="button btn btn-outline-primary"><i class="fa fa-plug"></i> Test AI Connection</button></div><div id="grav-chatbot-test-api-result" style="margin-top:12px; display:none;"></div>'
          ignore: true

    section_faq:
      type: section
      title: PLUGIN_AI_CHATBOT.FAQ_SETTINGS
      underline: true
      fields:
        faq_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.FAQ_ENABLED
          help: PLUGIN_AI_CHATBOT.FAQ_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        enable_multilingual_faq:
          type: toggle
          label: PLUGIN_AI_CHATBOT.ENABLE_MULTILINGUAL_FAQ
          help: PLUGIN_AI_CHATBOT.ENABLE_MULTILINGUAL_FAQ_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        faq_route:
          type: text
          label: PLUGIN_AI_CHATBOT.FAQ_ROUTE
          help: PLUGIN_AI_CHATBOT.FAQ_ROUTE_HELP
          default: /faq

        faq_similarity_threshold:
          type: range
          label: PLUGIN_AI_CHATBOT.FAQ_SIMILARITY
          help: PLUGIN_AI_CHATBOT.FAQ_SIMILARITY_HELP
          default: 70
          validate:
            min: 50
            max: 100
            step: 5

    section_contact:
      type: section
      title: PLUGIN_AI_CHATBOT.CONTACT_SETTINGS
      underline: true
      fields:
        contact_route:
          type: text
          label: PLUGIN_AI_CHATBOT.CONTACT_ROUTE
          help: PLUGIN_AI_CHATBOT.CONTACT_ROUTE_HELP
          default: /contact

        enable_hidden_contacts:
          type: toggle
          label: PLUGIN_AI_CHATBOT.ENABLE_HIDDEN_CONTACTS
          help: PLUGIN_AI_CHATBOT.ENABLE_HIDDEN_CONTACTS_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        hidden_contact_route:
          type: text
          label: PLUGIN_AI_CHATBOT.HIDDEN_CONTACT_ROUTE
          help: PLUGIN_AI_CHATBOT.HIDDEN_CONTACT_ROUTE_HELP
          default: /hidden-contacts

    section_ui:
      type: section
      title: PLUGIN_AI_CHATBOT.UI_SETTINGS
      underline: true
      fields:
        theme_preset:
          type: select
          label: PLUGIN_AI_CHATBOT.THEME_PRESET
          help: PLUGIN_AI_CHATBOT.THEME_PRESET_HELP
          default: glass_blue
          options:
            glass_blue: Modern Glassmorphic Blue
            emerald_dark: Emerald Dark Mode
            purple_haze: Purple Haze Glass
            sunset_orange: Sunset Orange Vibrant
            custom: Custom Color Picker

        position:
          type: select
          label: PLUGIN_AI_CHATBOT.WIDGET_POSITION
          default: bottom-right
          options:
            bottom-right: Bottom Right
            bottom-left: Bottom Left

        display_mode:
          type: select
          label: PLUGIN_AI_CHATBOT.DISPLAY_MODE
          help: PLUGIN_AI_CHATBOT.DISPLAY_MODE_HELP
          default: all
          options:
            all: All Pages
            selected_only: Only Selected Pages
            exclude_selected: Exclude Selected Pages

        display_pages:
          type: textarea
          label: PLUGIN_AI_CHATBOT.DISPLAY_PAGES
          help: PLUGIN_AI_CHATBOT.DISPLAY_PAGES_HELP
          default: "/\n/contact\n/faq"

        welcome_message:
          type: text
          label: PLUGIN_AI_CHATBOT.WELCOME_MESSAGE
          default: 'Hello! How can I help you with this website today?'

        accent_color:
          type: colorpicker
          label: PLUGIN_AI_CHATBOT.ACCENT_COLOR
          help: PLUGIN_AI_CHATBOT.ACCENT_COLOR_HELP
          default: '#3b82f6'

        quick_replies_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.QUICK_REPLIES_ENABLED
          help: PLUGIN_AI_CHATBOT.QUICK_REPLIES_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        quick_replies:
          type: list
          label: PLUGIN_AI_CHATBOT.QUICK_REPLIES
          help: PLUGIN_AI_CHATBOT.QUICK_REPLIES_HELP
          style: vertical
          fields:
            label:
              type: text
              label: Button Label
              default: '📝 Summarize Page'
            type:
              type: select
              label: Action Type
              default: action
              options:
                action: Internal Action (summarize_page, contact)
                question: Question / Prompt Query
            action_or_prompt:
              type: text
              label: Action Name or Question Prompt
              default: 'summarize_page'

        notification_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_ENABLED
          help: PLUGIN_AI_CHATBOT.NOTIFICATION_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        notification_text:
          type: text
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_TEXT
          default: '👋 Hi there! Need help finding anything on our website?'

        notification_delay_seconds:
          type: text
          label: PLUGIN_AI_CHATBOT.NOTIFICATION_DELAY
          default: 4

    section_session:
      type: section
      title: PLUGIN_AI_CHATBOT.SESSION_SETTINGS
      underline: true
      fields:
        session_retention_days:
          type: text
          label: PLUGIN_AI_CHATBOT.SESSION_RETENTION_DAYS
          help: PLUGIN_AI_CHATBOT.SESSION_RETENTION_DAYS_HELP
          default: 7

    section_security:
      type: section
      title: PLUGIN_AI_CHATBOT.SECURITY_SETTINGS
      underline: true
      fields:
        rate_limit_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_ENABLED
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        rate_limit_max_requests:
          type: text
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_MAX
          default: 10

        rate_limit_window_seconds:
          type: text
          label: PLUGIN_AI_CHATBOT.RATE_LIMIT_WINDOW
          default: 60

        strict_site_scope:
          type: toggle
          label: PLUGIN_AI_CHATBOT.STRICT_SITE_SCOPE
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

    section_logging:
      type: section
      title: PLUGIN_AI_CHATBOT.LOGGING_SETTINGS
      underline: true
      fields:
        logging_enabled:
          type: toggle
          label: PLUGIN_AI_CHATBOT.LOGGING_ENABLED
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        log_api_usage:
          type: toggle
          label: PLUGIN_AI_CHATBOT.LOG_API_USAGE
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

    section_analytics:
      type: section
      title: AI Analytics & Performance Dashboard
      underline: true
      fields:
        analytics_dashboard_display:
          type: display
          markdown: true
          content: '<div class="grav-chatbot-analytics-dashboard"><h2>🤖 AI Chatbot Analytics & Performance Reports</h2><p class="teaser">Track visitor query trends, FAQ pre-matching cost savings, token consumption, and automated FAQ recommendations.</p><div class="grav-analytics-cards"><div class="grav-card"><div class="grav-card-label">Total Queries</div><div class="grav-card-value" id="card-total-queries">0</div></div><div class="grav-card green"><div class="grav-card-label">FAQ Matches (Free Hits)</div><div class="grav-card-value" id="card-faq-hits">0</div></div><div class="grav-card blue"><div class="grav-card-label">AI API Requests</div><div class="grav-card-value" id="card-ai-hits">0</div></div><div class="grav-card orange"><div class="grav-card-label">Est. API Tokens</div><div class="grav-card-value" id="card-total-tokens">0</div></div></div><div class="grav-analytics-actions" style="margin-top:15px; margin-bottom:20px;"><a href="/chatbot-export?format=csv" class="button button-action btn btn-outline-primary" style="margin-right:10px;">📥 Export CSV Report</a> <a href="/chatbot-export?format=json" class="button btn btn-outline-secondary">📄 Export JSON Data</a></div><div class="grav-analytics-charts-grid"><div class="grav-chart-container"><h3>📈 Daily Interaction Volume</h3><div id="chart-daily-volume" class="grav-svg-chart"></div></div><div class="grav-chart-container"><h3>📊 Query Source Distribution Ratio</h3><div id="chart-ratio" class="grav-svg-chart"></div></div></div><div class="grav-analytics-recommendations" style="margin-top:20px;"><h3>💡 Candidate FAQ Recommendations</h3><p>The following visitor questions were frequently handled by the AI API. Adding them to your <code>/faq</code> page will answer future queries instantly for free!</p><table class="grav-table"><thead><tr><th>Frequency</th><th>Sample Visitor Question</th><th>AI Generated Response</th></tr></thead><tbody id="recommendations-table-body"><tr><td colspan="3" class="text-center">Loading recommendations...</td></tr></tbody></table></div></div>'
          ignore: true
